    <div class="contenedor">
        <h1>Sistema de evaluación de calificaciones</h1>

        <div class="campo">
            <label for="nombre">Nombre del estudiante:</label>
            <input type="text" id="nombre" placeholder="Ej. Ana López">
        </div>

        <div class="campo">
            <label for="calif1">Primera calificación (0 - 10):</label>
            <input type="number" id="calif1" step="0.1" min="0" max="10" placeholder="0.0">
        </div>

        <div class="campo">
            <label for="calif2">Segunda calificación (0 - 10):</label>
            <input type="number" id="calif2" step="0.1" min="0" max="10" placeholder="0.0">
        </div>

        <div class="campo">
            <label for="calif3">Tercera calificación (0 - 10):</label>
            <input type="number" id="calif3" step="0.1" min="0" max="10" placeholder="0.0">
        </div>

        <button type="button" onclick="procesarCalificaciones()">Calcular promedio</button>

        <!-- Espacio para mostrar los resultados -->
        <div id="resultados" class="resultado-box"></div>
    </div>

    <!-- Vinculación con el archivo JavaScript externo -->
    <script src="calificaciones.js"></script>
